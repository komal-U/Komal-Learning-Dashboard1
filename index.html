.stat p{color:#1765a5;font-size:32px;font-weight:bold}
.toolbar{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap}
input,select{border:1px solid #d5deea;border-radius:9px;padding:12px;background:white;font-size:14px}

select{min-width:155px}

.card{background:white;border-radius:14px;padding:21px;border-top:5px solid #2475b9;box-shadow:0 4px 15px #0000000d;transition:.2s}

.card h3{color:#1765a5;font-size:18px;margin-bottom:5px}
.place{color:#64748b;font-size:13px;margin-bottom:15px}
.badge{display:inline-block;background:#e8f3ff;color:#1765a5;border-radius:20px;padding:4px 11px;font-size:12px;margin-bottom:10px}
.label{font-size:14px;font-weight:bold;color:#174c7b;margin-top:14px;margin-bottom:4px}
.card p{font-size:14px;overflow-wrap:anywhere}
.challenge{background:#fff5e8;border-radius:8px;padding:10px}
.no-results{grid-column:1/-1;background:white;padding:30px;text-align:center;border-radius:12px;color:#64748b}
footer{text-align:center;padding:30px 15px;color:#64748b;font-size:13px}
@media(max-width:600px){.toolbar{flex-direction:column}input,select{width:100%}}
</style>
</head>

function formatDate(dateString){
    return new Date(dateString+"T12:00:00").toLocaleDateString("en-IN",{
        day:"2-digit",month:"long",year:"numeric"
    });
}

function escapeHTML(value){
    return String(value||"").replace(/[&<>"']/g,c=>({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    })[c]);
}

function renderCard(date,item){
    const challengeHTML=item.challenges
        ? `<div class="label">Challenges</div><p class="challenge">${escapeHTML(item.challenges)}</p>`
        : "";

    return `
    <article class="card">
        <span class="badge">Daily Learning</span>
        <h3>${formatDate(date)}</h3>
        <div class="place">📍 ${escapeHTML(item.place)}</div>
        <div class="label">Field Visit & Activity</div>
        <p>${escapeHTML(item.activity)}</p>
        <div class="label">Learning of the Day</div>
        <p>${escapeHTML(item.learning)}</p>
        <div class="label">Key Takeaway</div>
        <p>${escapeHTML(item.takeaway)}</p>
        ${challengeHTML}
    </article>`;
}

function renderDashboard(){
    const container=document.getElementById("entriesContainer");
    const search=document.getElementById("searchInput").value.toLowerCase().trim();
    const month=document.getElementById("monthFilter").value;
    const sort=document.getElementById("sortFilter").value;

    let dates=Object.keys(entries).filter(date=>{
        if(month!=="all"&&!date.startsWith(month)) return false;
        const item=entries[date];
        const searchable=[
            date,formatDate(date),item.place,item.activity,
            item.learning,item.takeaway,item.challenges
        ].join(" ").toLowerCase();
        return searchable.includes(search);
    });

    dates.sort((a,b)=>sort==="newest"?b.localeCompare(a):a.localeCompare(b));

    if(dates.length===0){
        container.innerHTML='<div class="no-results">No matching dates found.</div>';
        return;
    }

    container.innerHTML=dates.map(date=>renderCard(date,entries[date])).join("");
}

document.getElementById("searchInput").addEventListener("input",renderDashboard);
document.getElementById("monthFilter").addEventListener("change",renderDashboard);
document.getElementById("sortFilter").addEventListener("change",renderDashboard);
